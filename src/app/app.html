<mat-toolbar color="primary">
  <span>{{ title() }}</span>
  <span class="spacer"></span>
  <button mat-icon-button (click)="themeService.toggleTheme()" aria-label="Toggle dark/light mode">
    <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<main class="content-container">
  <h1>Welcome to Angular Material</h1>
  <p>This project is now configured with Angular Material's theming system.</p>
  
  <div class="actions">
    <button mat-raised-button color="accent">Click Me!</button>
    <a mat-button href="https://material.angular.io/" target="_blank">Documentation</a>
  </div>
</main>

<router-outlet />
